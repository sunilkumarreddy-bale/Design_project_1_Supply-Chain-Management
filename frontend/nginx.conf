server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Optional: when the API runs next to this container as "backend", proxy it on the same origin.
  # location /api/ { proxy_pass http://backend:4000; }
  # location /socket.io/ { proxy_pass http://backend:4000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }

  location / {
    try_files $uri /index.html;
  }
}
